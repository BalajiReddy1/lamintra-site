<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for public/img/og-card.png, rendered at 1200x630 by scripts/og-card.mjs.

  This lived in a temporary scratchpad until 2026-08-11, which is exactly why
  it drifted: it said "5 components" three months after the sixth shipped, and
  it showed a jar filename that does not exist. It is in the repo now, and
  every value that can go stale is a token filled in from the same data the
  site renders from.

  The fonts are inlined as base64 by the script rather than fetched. They used
  to come from fonts.googleapis.com here, which meant this render depended on
  the network and on the one origin the whole project went out of its way to
  remove.
-->
<style>
  @font-face {
    font-family: Archivo;
    src: url(data:font/woff2;base64,{{FONT_SANS}}) format('woff2');
    font-weight: 100 900;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url(data:font/woff2;base64,{{FONT_MONO}}) format('woff2');
    font-weight: 100 800;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #040200;
    background-image: radial-gradient(ellipse 1400px 900px at 50% 0%, #221D15 0%, rgba(34,29,21,0) 72%);
    font-family: Archivo, sans-serif;
    color: #F8F5F2;
    padding: 72px 76px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    letter-spacing: 0;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  /* `.wordmark span` was removed with the /ui suffix on 2026-08-16. */
  .wordmark { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .wordmark svg { flex: none; }
  .meta {
    font-family: 'JetBrains Mono', monospace; font-size: 17px;
    color: #84827E; letter-spacing: 0.02em;
  }
  h1 {
    font-size: 82px; font-weight: 700; line-height: 1.02;
    letter-spacing: -0.03em; max-width: 17ch;
  }
  h1 .kicker { display: block; color: #A6A4A1; font-weight: 600; }
  .cmd {
    display: inline-flex; align-items: center; gap: 18px;
    background: #0D0A05; border: 1px solid #5E5A52;
    border-radius: 999px; padding: 16px 16px 16px 30px;
    font-family: 'JetBrains Mono', monospace; font-size: 25px;
    color: #F8F5F2; letter-spacing: -0.005em; align-self: flex-start;
  }
  .cmd .dim { color: #84827E; }
  .cmd .pill {
    background: #F8F5F2; color: #040200; border-radius: 999px;
    padding: 9px 22px; font-family: Archivo, sans-serif;
    font-size: 19px; font-weight: 600; letter-spacing: 0;
  }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .facts { display: flex; gap: 30px; font-size: 20px; color: #A6A4A1; }
  .facts b { color: #F8F5F2; font-weight: 600; }
  .accent { width: 10px; height: 10px; border-radius: 50%; background: #C8FF34; display: inline-block; margin-right: 10px; vertical-align: middle; }
</style>
</head>
<body>
  <div class="top">
    <div class="wordmark"><svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><mask id="ogmark"><rect width="32" height="32" fill="white"/><path d="M 16.50 0.00 L 28.50 0.00 L 28.50 0.00 L 30.11 0.03 L 30.72 0.13 L 31.15 0.29 L 31.47 0.53 L 31.71 0.85 L 31.87 1.28 L 31.97 1.89 L 32.00 3.50 L 32.00 15.50 L 32.00 15.50 L 31.97 17.11 L 31.87 17.72 L 31.71 18.15 L 31.47 18.47 L 31.15 18.71 L 30.72 18.87 L 30.11 18.97 L 28.50 19.00 L 16.50 19.00 L 16.50 19.00 L 14.89 18.97 L 14.28 18.87 L 13.85 18.71 L 13.53 18.47 L 13.29 18.15 L 13.13 17.72 L 13.03 17.11 L 13.00 15.50 L 13.00 3.50 L 13.00 3.50 L 13.03 1.89 L 13.13 1.28 L 13.29 0.85 L 13.53 0.53 L 13.85 0.29 L 14.28 0.13 L 14.89 0.03 L 16.50 0.00 Z" fill="black"/></mask></defs><path d="M 6.00 0.00 L 26.00 0.00 L 26.00 0.00 L 28.76 0.06 L 29.80 0.22 L 30.54 0.50 L 31.09 0.91 L 31.50 1.46 L 31.78 2.20 L 31.94 3.24 L 32.00 6.00 L 32.00 26.00 L 32.00 26.00 L 31.94 28.76 L 31.78 29.80 L 31.50 30.54 L 31.09 31.09 L 30.54 31.50 L 29.80 31.78 L 28.76 31.94 L 26.00 32.00 L 6.00 32.00 L 6.00 32.00 L 3.24 31.94 L 2.20 31.78 L 1.46 31.50 L 0.91 31.09 L 0.50 30.54 L 0.22 29.80 L 0.06 28.76 L 0.00 26.00 L 0.00 6.00 L 0.00 6.00 L 0.06 3.24 L 0.22 2.20 L 0.50 1.46 L 0.91 0.91 L 1.46 0.50 L 2.20 0.22 L 3.24 0.06 L 6.00 0.00 Z" fill="#F8F5F2" mask="url(#ogmark)"/></svg>Lamintra</div>
    <div class="meta">MIT &nbsp;/&nbsp; JDK 17+ &nbsp;/&nbsp; {{VERSION}}</div>
  </div>

  <h1><span class="kicker">Compose components</span> that aren't Material.</h1>

  <div class="cmd">
    <span><span class="dim">$</span>&nbsp;{{COMMAND}}</span>
    <span class="pill">Copy</span>
  </div>

  <div class="bottom">
    <div class="facts">
      <span><b>No</b> Gradle dependency</span>
      <span><b>{{COUNT}}</b> components</span>
      <span>Android, iOS, desktop, web</span>
    </div>
    <div class="meta"><span class="accent"></span>compose.foundation only</div>
  </div>
</body>
</html>
